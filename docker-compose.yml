# Bring-up stack: conference behind traefik with Let's Encrypt TLS.
# Fill in .env (BASE_URL, TURN_TLS_HOST, ACME_EMAIL, API_KEYS,
# EXTERNAL_IPS) and run `docker compose up -d`. Port 5000/udp carries
# the WebRTC ICE mux and 3478/udp+tcp the built-in TURN relay; both must
# stay reachable. Traefik terminates TLS for TURN_TLS_HOST on 443 and
# forwards it to the relay, for networks that only allow HTTPS out.
services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  conference:
    image: ghcr.io/stubbedev/conference:latest
    build: .
    restart: unless-stopped
    environment:
      BASE_URL: ${BASE_URL}
      API_KEYS: ${API_KEYS}
      JOIN_ONLY: ${JOIN_ONLY:-false}
      OPEN_CREATE_HOSTS: ${OPEN_CREATE_HOSTS:-}
      ROOM_TTL_DAYS: ${ROOM_TTL_DAYS:-365}
      EXTERNAL_IPS: ${EXTERNAL_IPS}
      TURN_TLS_HOST: ${TURN_TLS_HOST}
    volumes:
      - data:/data
    ports:
      - "5000:5000/udp"
      - "3478:3478/udp"
      - "3478:3478/tcp"
    labels:
      - traefik.enable=true
      - traefik.http.routers.conference.rule=Host(`${BASE_URL}`)
      - traefik.http.routers.conference.entrypoints=websecure
      - traefik.http.routers.conference.tls.certresolver=letsencrypt
      - traefik.http.routers.conference.service=conference
      - traefik.http.services.conference.loadbalancer.server.port=8080
      - traefik.tcp.routers.conference-turn.rule=HostSNI(`${TURN_TLS_HOST}`)
      - traefik.tcp.routers.conference-turn.entrypoints=websecure
      - traefik.tcp.routers.conference-turn.tls.certresolver=letsencrypt
      - traefik.tcp.routers.conference-turn.service=conference-turn
      - traefik.tcp.services.conference-turn.loadbalancer.server.port=3478

volumes:
  letsencrypt:
  data:
