# Language registry. The conference app takes its language list from here
# (via the speech service's /v1/status).
# code: the app's language code; whisper: Whisper's code; voices: the
# Piper voice per voice choice a speaker can make; address (optional): how
# to address the listener, so a translation does not mix forms;
# api_voices (optional): the voice per choice for an openai-compatible
# VOICE_PROVIDER, e.g. {female: nova, male: onyx}.
languages:
  en:
    name: English
    whisper: en
    voices:
      female: en_US-lessac-medium
      male: en_US-ryan-medium
  de:
    name: German
    whisper: de
    address: Always address people formally with "Sie", never "du"
    voices:
      female: de_DE-kerstin-low
      male: de_DE-thorsten-medium
  sv:
    name: Swedish
    whisper: sv
    address: Always address people with "du", never "ni"
    voices:
      female: sv_SE-lisa-medium
      male: sv_SE-nst-medium
