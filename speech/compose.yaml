services:
  speech:
    build:
      context: ..
      dockerfile: speech/Dockerfile
    restart: unless-stopped
    ports:
      - "${SPEECH_PORT:-8090}:8090"
    environment:
      SPEECH_SECRET: ${SPEECH_SECRET:?set SPEECH_SECRET}
      OPENAI_URL: ${OPENAI_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRANSCRIBE_URL: ${TRANSCRIBE_URL:-}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-}
      TRANSCRIBE_EXTERNAL: ${TRANSCRIBE_EXTERNAL:-}
      TRANSCRIBE_RESPONSE_FORMAT: ${TRANSCRIBE_RESPONSE_FORMAT:-}
      INTERIM_MS: ${INTERIM_MS:-}
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-ollama}
      TRANSLATE_URL: ${TRANSLATE_URL:-}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_EXTERNAL: ${TRANSLATE_EXTERNAL:-}
      VOICE_URL: ${VOICE_URL:-}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_NAME: ${VOICE_NAME:-}
      VOICE_RATE: ${VOICE_RATE:-}
      VOICE_EXTERNAL: ${VOICE_EXTERNAL:-}
      GLOSSARY: ${GLOSSARY:-}
