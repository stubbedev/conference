name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # The tests that send a media socket a burst skip on a kernel that
      # caps receive buffers below the 4 MiB the server asks for, which a
      # stock kernel does.
      - name: allow the media receive buffer
        run: sudo sysctl -w net.core.rmem_max=4194304
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node brand/brand.mjs --check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Real browsers, real media: the pipeline has failed silently before
  # (an encoded-frame API that no browser ships, RTP extensions the
  # receiver could not demux) with every unit test green.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # The server under test gets the receive buffer it asks for, as a
      # deployment that follows the README does.
      - name: allow the media receive buffer
        run: sudo sysctl -w net.core.rmem_max=4194304
      # The smoke test measures the recording's audio with ffmpeg.
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: smoke
        run: node web/e2e/smoke.mjs
        env:
          CHROME: google-chrome
      # A share scrolled in bursts must stay fluid after sitting still,
      # presented from Chrome and from Firefox (both on the runner image).
      - name: share bursts
        run: node web/e2e/share-burst.mjs
        env:
          CHROME: google-chrome
          FIREFOX: firefox
      # Every start of a share must be sent and decoded. The start that
      # failed once in dozens under load is made to fail every time by
      # forcing its garbage collection, so the test needs no load and no
      # luck.
      - name: share starts
        run: node web/e2e/share-start.mjs
        env:
          CHROME: google-chrome
          FIREFOX: firefox

  # Live translation end to end: the server's speech engines are stand-ins
  # (no downloads, no translation service), everything else is real.
  e2e-translate:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: translate
        run: node web/e2e/translate.mjs
        env:
          CHROME: google-chrome

  image:
    runs-on: ubuntu-latest
    needs: [backend, web, e2e, e2e-translate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: conference:ci
